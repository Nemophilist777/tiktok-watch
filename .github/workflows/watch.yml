name: TikTok Watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TIKTOK_COOKIE: ${{ secrets.TIKTOK_COOKIE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python watch.py

      - name: Persist state
        run: |
          if git diff --quiet -- state.json; then
            echo "state 未变化"
            exit 0
          fi
          git config user.name "tiktok-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update tiktok watch state [skip ci]"
          git push
